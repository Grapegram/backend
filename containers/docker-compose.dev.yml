version: "3.8"

services:
    app:
        container_name: grapegram_backend_dev
        image: grapegram_backend_dev
        build:
            target: development
        volumes:
            - ${CONTEXT}:/app
            - /app/.venv
        networks:
            - app-network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            kafka:
                condition: service_healthy
            minio:
                condition: service_healthy
            mailpit:
                condition: service_healthy

    postgres:
        image: postgres:16
        container_name: grapegram_postgres_dev
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES__DB}
            POSTGRES_USER: ${POSTGRES__USER}
            POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - grapegram_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready", "-d", "${POSTGRES__DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - app-network

    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: grapegram_pgadmin_dev
        restart: unless-stopped
        user: root
        environment:
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            POSTGRES_DB: ${POSTGRES__DB}
            POSTGRES_USER: ${POSTGRES__USER}
            POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN__EMAIL:-admin@grapegram.com}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN__PASSWORD:-admin}
            PGADMIN_CONFIG_SERVER_MODE: "False"
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
        ports:
            - "5050:80"
        volumes:
            - grapegram_pgadmin_data:/var/lib/pgadmin
            - ${CONTAINERS}/pgadmin/init.sh:/entrypoint_custom.sh
        entrypoint: /entrypoint_custom.sh
        networks:
            - app-network
        depends_on:
            postgres:
                condition: service_healthy

    mailpit:
        image: axllent/mailpit:latest
        container_name: grapegram_mailpit_dev
        restart: unless-stopped
        ports:
            - "${SMTP__PORT}:1025" # SMTP port
            - "8025:8025" # Web UI port
        environment:
            MP_MAX_MESSAGES: 5000
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--no-verbose",
                    "--tries=1",
                    "--spider",
                    "http://localhost:8025/api/v1/info",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - app-network

    redis:
        image: redis:8.4-alpine
        container_name: grapegram_redis_dev
        restart: unless-stopped
        ports:
            - "6379:6379"
        command: redis-server --appendonly yes
        volumes:
            - grapegram_redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - app-network

    redis-insight:
        image: redislabs/redisinsight:latest
        container_name: grapegram_redis_insight_dev
        restart: unless-stopped
        ports:
            - "5540:5540"
        volumes:
            - grapegram_redis_insight_data:/data
        networks:
            - app-network
        depends_on:
            redis:
                condition: service_healthy

    minio:
        image: minio/minio
        container_name: grapegram_minio_dev
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: admin
            MINIO_ROOT_PASSWORD: password123
        command: server /data --console-address ":9001"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -k -f http://127.0.0.1:9001/minio/health/live || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        volumes:
            - grapegram_s3_data:/data
        networks:
            - app-network

    kafka:
        image: apache/kafka:latest
        container_name: grapegram_kafka_dev
        restart: unless-stopped
        ports:
            - "9092:9092"
            - "9093:9093"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094,PLAINTEXT_HOST://0.0.0.0:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
            CLUSTER_ID: grapegram-kafka-cluster-1
        volumes:
            - grapegram_kafka_data:/var/lib/kafka/data
        healthcheck:
            test:
                [
                    "CMD",
                    "/opt/kafka/bin/kafka-broker-api-versions.sh",
                    "--bootstrap-server",
                    "localhost:9092",
                ]
            interval: 10s
            timeout: 10s
            retries: 5
            start_period: 30s
        networks:
            - app-network

    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: grapegram_kafka_ui_dev
        restart: unless-stopped
        ports:
            - "9080:8080"
        environment:
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
            DYNAMIC_CONFIG_ENABLED: "true"
        networks:
            - app-network
        depends_on:
            kafka:
                condition: service_healthy

volumes:
    grapegram_postgres_data:
    grapegram_pgadmin_data:
    grapegram_redis_data:
    grapegram_redis_insight_data:
    grapegram_s3_data:
    grapegram_kafka_data:

networks:
    app-network:
        driver: bridge
