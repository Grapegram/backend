name: Deploy to Azure Container Registry

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
        types: [closed]

env:
    IMAGE_NAME: grapegram-backend

jobs:
    build-and-push:
        # Only run on direct push to main or when PR is merged to main
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Log in to Azure Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
                  username: ${{ secrets.AZURE_REGISTRY_TOKEN_NAME }}
                  password: ${{ secrets.AZURE_REGISTRY_TOKEN }}

            - name: Extract metadata for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./containers/Dockerfile
                  target: production
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  platforms: linux/amd64

            - name: Image digest
              run: echo ${{ steps.meta.outputs.digest }}
