[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=45.0.3",
    "litestar>=2.16.0",
    "pydantic[email]>=2.11.5",
    "pydantic-settings>=2.9.1",
    "uvicorn>=0.34.3",
    "returns>=0.26.0",
    "classes>=0.4.1",
    "stories>=5.1.0",
    "pyjwt>=2.10.1",
    "aiosmtplib>=5.0.0",
    "jinja2>=3.1.6",
    "dishka>=1.7.2",
    "msgspec>=0.19.0",
    "faststream[kafka]>=0.6.3",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17.2",
    "asyncpg>=0.30.0",
    "websockets>=15.0.1",
    "anyio>=4.11.0",
    "aioboto3>=15.5.0",
    "azure-storage-blob>=12.27.1",
    "aiohttp>=3.13.2",
]

[project.scripts]
serve = "src.app.entrypoints.api:main"


[tool.ruff]
extend-select = [
    "I",  #isort
    "UP", #pyupgrade
    "F",  #pyflakes
]
exclude = ["src/migrations"]

[tool.ruff.extend-per-file-ignores]
# Also ignore `F401` in all `__init__.py` files.
"__init__.py" = ["F401"]

[tool.mypy]
plugins = ["returns.contrib.mypy.returns_plugin"]


[tool.hatch.build.targets.wheel]
packages = ["src", "seedwork"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pre-commit>=4.4.0",
    "pytest>=9.0.1",
    "ruff>=0.11.12",
]
